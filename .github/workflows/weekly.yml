name: pretty-tough-weekly

on:
  schedule:
    - cron: "0 6 * * *"      # daily 06:00 UTC; only episodes that are 7+ days old are processed
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild charts even if no new episode was ingested"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: pretty-tough
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      new_data: ${{ steps.pipeline.outputs.new_data }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          plotly_get_chrome -y || true

      - name: Check feed for new episodes
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID }}
          TITLE_FILTER: ${{ vars.TITLE_FILTER }}
          PLAYLIST_ID: ${{ vars.PLAYLIST_ID }}
          WATCH_FROM_DATE: ${{ vars.WATCH_FROM_DATE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python watch_feed.py

      - name: Run pipeline
        id: pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COMMENT_SOURCE: ${{ vars.COMMENT_SOURCE }}
          INCLUDE_REPLIES: ${{ vars.INCLUDE_REPLIES }}
          MAX_SCAN: ${{ vars.MAX_SCAN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then python run_weekly.py --force; else python run_weekly.py; fi

      - name: Upload charts and tables
        if: always() && steps.pipeline.outputs.new_data == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pretty-tough-${{ github.run_id }}
          path: out/
          retention-days: 90

      # Public results page (GitHub Pages). Off unless the repository variable PUBLISH_SITE is set to "true".
      - name: Build results page
        if: steps.pipeline.outputs.new_data == 'true' && vars.PUBLISH_SITE == 'true'
        run: python build_site.py --out out --site site

      - name: Package results page
        if: steps.pipeline.outputs.new_data == 'true' && vars.PUBLISH_SITE == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    if: needs.run.outputs.new_data == 'true' && vars.PUBLISH_SITE == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

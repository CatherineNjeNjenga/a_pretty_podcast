name: sample-comments

on:
  workflow_dispatch:
    inputs:
      about:
        description: "Which category to sample"
        type: choice
        default: "Both"
        options: [Both, Neither, Maria, Guest, Show, Request, Pair, Unnamed, Reaction, Topic, Noise]
      n:
        description: "How many comments to sample"
        default: "150"

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - name: Sample
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          N: ${{ inputs.n }}
          ABOUT: ${{ inputs.about }}
        run: python sample_neither.py --about "$ABOUT" --n "$N"
      - uses: actions/upload-artifact@v4
        with:
          name: comment-sample
          path: comment_sample.csv
          retention-days: 1

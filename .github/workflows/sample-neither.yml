name: sample-neither-comments

on:
  workflow_dispatch:
    inputs:
      n:
        description: "How many Neither comments to sample"
        default: "150"

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - name: Sample
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          N: ${{ inputs.n }}
        run: python sample_neither.py --n "$N"
      - uses: actions/upload-artifact@v4
        with:
          name: neither-sample
          path: neither_sample.csv
          retention-days: 1
